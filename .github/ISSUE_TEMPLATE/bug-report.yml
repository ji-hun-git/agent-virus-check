name: Bug report
description: Something does not work, crashes, or behaves differently from the documentation.
title: "Bug: "
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what it printed. Remove anything private, such as keys and paths.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Operating system, Python version, and the agent, if the guard was involved.
      placeholder: Windows 11, Python 3.13, Claude Code 2.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `pah --version`, or the commit or tag you used.
