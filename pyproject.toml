[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-anti-hack"
version = "0.1.0"
description = "A local shield for people who let AI coding agents open, install and run code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Jihun Chae" }]
keywords = ["security", "malware", "supply-chain", "ai-agents", "claude-code", "mcp", "prompt-injection", "typosquatting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
pah = "pah.cli:main"

[project.urls]
Homepage = "https://github.com/ji-hun-git/personal-anti-hack"
Issues = "https://github.com/ji-hun-git/personal-anti-hack/issues"

[tool.setuptools]
packages = ["pah"]

[tool.setuptools.package-data]
pah = ["data/*.txt"]
