<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
<title id="title">agent-virus-check</title><desc id="desc">Scans your computer, watches what arrives and quarantines what it blocks; reads repositories, skills, MCP servers and packages before they run. The checks run in code, on your machine.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13213d"/><stop offset="0.6" stop-color="#0d1117"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#8fb4ff" fill-opacity="0.12"/></pattern><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4c8df6" stop-opacity="0.35"/><stop offset="1" stop-color="#4c8df6" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="1280" height="640" rx="0" fill="url(#bg)"/>
<rect x="0" y="0" width="1280" height="640" rx="0" fill="url(#dots)"/>
<ellipse cx="1080" cy="150" rx="420" ry="300" fill="url(#glow)"/>
