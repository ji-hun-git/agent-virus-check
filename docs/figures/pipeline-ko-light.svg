<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
<title id="title">작동 방식</title><desc id="desc">에이전트가 실행하는 모든 명령은 먼저 가드를 거칩니다. 설치·설정 명령이면 프로젝트 전체를 검사한 뒤에만 실행됩니다.</desc>
<rect x="0.5" y="0.5" width="959" height="719" rx="15.5" fill="#ffffff" stroke="#d1d9e0"/>
<text x="28" y="42" font-size="20" font-weight="700" fill="#1f2328">작동 방식</text>
<text x="28" y="66" font-size="13.5" fill="#59636e">에이전트가 실행하는 모든 명령은 먼저 가드를 거칩니다. 설치·설정 명령이면 프로젝트 전체를 검사한 뒤에만 실행됩니다.</text>
<rect x="28" y="104" width="184" height="288" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="42" y="130" font-size="13.5" font-weight="700" fill="#1f2328">에이전트가 다루는 것</text>
